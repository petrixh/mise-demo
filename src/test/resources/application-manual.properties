# Profile activated by ManualExamplesReportsIT (@ActiveProfiles("manual")).
#
# Goal: drive the REAL chat dock in a browser against the LIVE LLM — unlike the `it`
# profile, which stubs the ChatModel and excludes the OpenAI autoconfig. In-memory H2,
# isolated from ./data/mise.
#
# The live endpoint comes from the always-included `local` profile
# (application-local.properties) — exactly the mechanism application-ai-it.properties relies
# on. Do NOT stub the ChatModel or exclude OpenAiChatAutoConfiguration here, so the real
# OpenAiChatModel + the production Reports AIControllers (chart/grid tools) are wired.

spring.datasource.url=jdbc:h2:mem:misemanual;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.jpa.hibernate.ddl-auto=create-drop

vaadin.devmode.devTools.enabled=false

# Live LLM endpoint (overlaid by application-local.properties via the `local` profile).
# Spring AI 2.0.0-M5 (official OpenAI SDK) appends /chat/completions — base-url MUST end in /v1.
spring.ai.openai.base-url=${MISE_MODEL_BASE_URL:http://localhost:8080/v1}
spring.ai.openai.api-key=${MISE_MODEL_API_KEY:not-needed}
spring.ai.openai.chat.options.model=${MISE_MODEL_NAME:Qwen3.6-35B-A3B-UD-Q4_K_XL-128k-coding-paralel-2}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=${MISE_MODEL_MAX_TOKENS:16384}

# Seed catalogs (same as production / ai-it) so recipes & stores load.
mise.seed.directory=demo/data
mise.seed.active-persona-file=demo/data/active_persona.txt
