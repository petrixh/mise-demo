# Global per-test safety ceiling. Applies to every @Test (not lifecycle/seeding
# methods). Fast unit + browserless tests finish in milliseconds and never hit it;
# this exists to stop a wedged live-LLM turn (see issue: AIIT had no test timeout)
# from hanging a run indefinitely.
#
# Mode is left at the default SAME_THREAD here on purpose: SEPARATE_THREAD would
# run the test body on a different thread than its lifecycle setup, breaking the
# @Transactional rollback unit tests and the Vaadin ThreadLocal browserless tests.
# The live-LLM AIITs (which can wedge on a stuck socket read that won't unwind on
# a same-thread interrupt) opt into SEPARATE_THREAD via a class-level @Timeout on
# MiseAIIT, which overrides this default for those classes only.
junit.jupiter.execution.timeout.testable.method.default = 5m
