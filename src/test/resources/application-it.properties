# Profile activated by MisePlaywrightIT (@ActiveProfiles("it")).
# Goal: isolate browser tests from the dev DB and from the live Qwen endpoint.

# In-memory H2 so each test run starts clean and does not touch ./data/mise
spring.datasource.url=jdbc:h2:mem:miseit;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.jpa.hibernate.ddl-auto=create-drop

# Disable the dev-tools gizmo (also set in main config but profile-loaded properties
# can race; keep it explicit here so IT runs never see the overlay).
vaadin.devmode.devTools.enabled=false

# Point Spring AI at a non-routable address so accidental LLM calls during tests
# fail fast instead of hitting the real Qwen. Tests that need AI should stub the
# ChatModel bean directly via TestAiConfig.
spring.ai.openai.base-url=http://127.0.0.1:1
spring.ai.openai.api-key=test-no-key

# Disable the OpenAI ChatModel autoconfig entirely so TestAiConfig's `openAiChatModel` bean
# is the only candidate. Bean overriding is unreliable across @Import vs autoconfig ordering;
# excluding the autoconfig is the deterministic option.
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
