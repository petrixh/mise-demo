# Profile activated by MiseAIIT (@ActiveProfiles("ai-it")).
#
# Goal: drive the production tool beans + system prompt against the LIVE LLM
# endpoint (no stubbed ChatModel), but isolate from the dev /data H2 file and
# allow two failsafe forks to run in parallel without colliding.
#
# The forkNumber system property is set by maven-failsafe-plugin
# (<systemPropertyVariables><miseit.forkNumber>${surefire.forkNumber}</...>)
# and is appended to the H2 in-memory URL so each fork gets its own DB.

# Per-fork in-memory H2 — JVM-scoped so each forked test process gets a clean DB.
spring.datasource.url=jdbc:h2:mem:miseaiit_${miseit.forkNumber:1};DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.jpa.hibernate.ddl-auto=create-drop

# Disable the dev-tools gizmo (it doesn't render without a web environment,
# but keep this explicit to silence the autoconfig).
vaadin.devmode.devTools.enabled=false

# Live LLM endpoint — falls back to the same Qwen default used in production.
spring.ai.openai.base-url=${MISE_MODEL_BASE_URL:http://192.168.1.196:8080}
spring.ai.openai.api-key=${MISE_MODEL_API_KEY:not-needed}
spring.ai.openai.chat.options.model=${MISE_MODEL_NAME:Qwen3.6-35B-A3B-UD-Q4_K_XL-128k-coding-paralel-2}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=${MISE_MODEL_MAX_TOKENS:16384}

# Seed data — same as production so tools see real recipes / stores.
mise.seed.directory=demo/data
mise.seed.active-persona-file=demo/data/active_persona.txt
