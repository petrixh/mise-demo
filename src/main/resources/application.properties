server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.example.mise

# --- H2 (file mode, survives app restart) ---
spring.datasource.url=jdbc:h2:file:./data/mise;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# --- H2 web console (accessible while the app is running) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Keep this false for the demo: only localhost can reach the console.
spring.h2.console.settings.web-allow-others=false

# --- Spring AI (OpenAI-compatible chat model) ---
# Default: local Qwen at 192.168.1.196:8080. Swap via env vars to point at any
# OpenAI-compatible endpoint (api.openai.com, Azure, Groq, etc.).
spring.ai.openai.base-url=${MISE_MODEL_BASE_URL:http://192.168.1.196:8080}
spring.ai.openai.api-key=${MISE_MODEL_API_KEY:not-needed}
spring.ai.openai.chat.options.model=${MISE_MODEL_NAME:Qwen3.6-35B-A3B-UD-Q5_K_XL}
spring.ai.openai.chat.options.temperature=0.2

