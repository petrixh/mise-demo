# Production profile — activated by the Docker image entrypoint (see Dockerfile).
#
# H2 lives at an absolute path so a single volume mount persists everything:
#   docker run -v mise-data:/data ...
spring.datasource.url=jdbc:h2:file:/data/mise;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1

# Seed catalogs are read from the filesystem at startup (recipes/stores/personas).
# The image ships them at /app/demo/data; mount your own directory over it to
# customize without rebuilding the image.
mise.seed.directory=/app/demo/data
mise.seed.active-persona-file=/app/demo/data/active_persona.txt

# Inside a container "localhost" is the container itself, so the H2 console
# would be unreachable through the mapped port without this. Demo-grade DB
# (sa / no password) — don't expose the port beyond your machine.
spring.h2.console.settings.web-allow-others=true
