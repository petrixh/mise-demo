name: Release validation

# release.yml only fires on `v*` tag pushes, so anything on the release path —
# the Dockerfile, or that workflow itself — reaches a real publish having never
# been executed once. This job closes that gap: on a PR that touches the release
# path it mirrors release.yml's image build and stops just short of the push.
#
# Everything that can actually break is exercised — buildx, QEMU emulation, the
# runtime-only `release` stage, both architectures. Only the publish is skipped,
# so nothing ever reaches GHCR from here.

on:
  pull_request:
    branches: [dev-main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-image:
    name: Build multi-arch image (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node (Vaadin frontend bundle)
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Mirrors release.yml: the fat JAR is architecture-independent, so build
      # it once natively and let buildx multi-arch only the `release` stage.
      # Running the Vaadin production build under QEMU would blow the timeout.
      #
      # Dependabot PRs get no access to repo secrets, so VAADIN_OFFLINE_KEY is
      # normally empty here and the watermarked build is used. That is fine —
      # this job validates the image build, not the licensing.
      - name: Build JAR
        env:
          VAADIN_OFFLINE_KEY: ${{ secrets.VAADIN_OFFLINE_KEY }}
        run: |
          if [ -n "$VAADIN_OFFLINE_KEY" ]; then
            ./mvnw -B -ntp clean package -DskipTests -Dvaadin.offlineKey="$VAADIN_OFFLINE_KEY"
          else
            echo "::notice::No VAADIN_OFFLINE_KEY available — validating a watermarked (commercialWithBanner) build"
            ./mvnw -B -ntp clean package -DskipTests -Dvaadin.commercialWithBanner
          fi

      - name: Set up QEMU (arm64 runtime stage)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Not required without a push, but it keeps login-action on the validated
      # path so its upgrades are exercised here rather than first running during
      # a real release.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged pr-<number> so that if this image is ever exported by hand it is
      # impossible to confuse with a released `latest` or semver tag.
      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number || github.run_id }}

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
