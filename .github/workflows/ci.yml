name: CI

on:
  push:
    branches: [dev-main]
  pull_request:
    branches: [dev-main]

# Cancel in-progress runs for the same branch/PR when new commits arrive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + Browserless tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node (Vaadin frontend bundle)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: ./mvnw -B -ntp test

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  playwright-it:
    name: Playwright IT (-Pit)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node (Vaadin frontend bundle)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pre-install Playwright browsers + OS deps so the first IT run doesn't
      # fail on a missing libnss3 / cold browser fetch. Java binding reads from
      # ~/.cache/ms-playwright/ which `npx playwright install` populates.
      - name: Install Playwright browsers
        run: npx -y playwright@1 install --with-deps chromium

      - name: Run Playwright IT (skips unit tests already covered by `test` job)
        run: ./mvnw -B -ntp -Pit verify -Dsurefire.skip=true

      - name: Upload Failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: |
            target/failsafe-reports/
            target/playwright-*
          retention-days: 7
          if-no-files-found: ignore
