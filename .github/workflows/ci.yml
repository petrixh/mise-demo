name: CI

on:
  push:
    branches: [dev-main]
  pull_request:
    branches: [dev-main]

# Cancel in-progress runs for the same branch/PR when new commits arrive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + Browserless tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node (Vaadin frontend bundle)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: ./mvnw -B -ntp test

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
