name: CI

on:
  push:
    branches: [dev-main]
  pull_request:
    branches: [dev-main]

# Cancel in-progress runs for the same branch/PR when new commits arrive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit + Playwright IT
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node (Vaadin frontend bundle)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pre-install Chromium + OS deps so the first IT doesn't fail on a
      # missing libnss3 or cold browser fetch. Playwright Java reads from
      # ~/.cache/ms-playwright/ which `npx playwright install` populates.
      - name: Install Playwright browsers
        run: npx -y playwright@1 install --with-deps chromium

      # Single Maven invocation: runs Surefire (unit + Browserless), then
      # build-frontend, then Failsafe (Playwright IT). If unit tests fail,
      # Maven short-circuits and IT never runs — fast feedback for cheap
      # failures, no rebuild cost between phases.
      #
      # -Pit activates the IT profile.
      # -Dvaadin.commercialWithBanner=true lets vaadin-chart (commercial)
      # build without a license — CI gets the bannered/watermarked variant.
      - name: Verify (unit + IT)
        run: ./mvnw -B -ntp -Pit -Dvaadin.commercialWithBanner=true verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore
