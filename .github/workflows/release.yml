name: Release

# Publish a multi-arch Docker image to GHCR whenever a release tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# → ghcr.io/<owner>/<repo>:0.1.0, :0.1 and :latest, linux/amd64 + linux/arm64.
#
# One-time manual step after the first publish: set the package visibility to
# public (repo → Packages → package settings) so users can pull anonymously.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    name: Build & publish multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node (Vaadin frontend bundle)
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The fat JAR is architecture-independent: build it once natively here,
      # then let buildx assemble the runtime-only `release` stage per platform.
      # Running the full Vaadin production build under QEMU emulation would
      # blow the job timeout.
      #
      # vaadin-chart (commercial, via the AI components) needs a license for
      # production builds.
      #
      # FIXME(banner-only): forced to the watermarked banner build for now.
      # The VAADIN_OFFLINE_KEY secret is set, but it belongs to a DAU-model
      # subscription, so an offlineKey build bakes "dau.enable=true" into
      # flow-build-info.json. At runtime that requires com.vaadin:license-checker
      # on the classpath AND a VAADIN_SUBSCRIPTION_KEY — neither is present in
      # the published image, so the container crashes at startup with
      # NoClassDefFoundError: com/vaadin/pro/licensechecker/dau/DauIntegration.
      # A keyless commercialWithBanner build does NOT enable DAU and runs fine,
      # so we force it here to ship a working (watermarked) image.
      #
      # To restore the licensed, watermark-free image: drop the override below
      # and re-enable the offlineKey branch, AND make the runtime satisfy DAU
      # (add license-checker as a runtime dependency + provide
      # VAADIN_SUBSCRIPTION_KEY to the container). See the commented branch.
      - name: Build JAR
        env:
          VAADIN_OFFLINE_KEY: ${{ secrets.VAADIN_OFFLINE_KEY }}
        run: |
          # Banner-only (keyless, no DAU). Verified to start and serve.
          ./mvnw -B -ntp clean package -DskipTests -Dvaadin.commercialWithBanner
          # --- licensed path, disabled for now (see FIXME above) ---
          # if [ -n "$VAADIN_OFFLINE_KEY" ]; then
          #   ./mvnw -B -ntp clean package -DskipTests -Dvaadin.offlineKey="$VAADIN_OFFLINE_KEY"
          # else
          #   echo "::warning::No VAADIN_OFFLINE_KEY secret set — publishing a watermarked (commercialWithBanner) build"
          #   ./mvnw -B -ntp clean package -DskipTests -Dvaadin.commercialWithBanner
          # fi

      # Direct-JAR flow (UC-098 Alternate Flow B): the seed catalogs are read
      # from demo/data on the filesystem, so a bare JAR boots empty. Stage the
      # JAR next to demo/ and upload the pair as one workflow artifact — the
      # artifact download is a zip the user extracts and runs in place.
      - name: Stage direct-run bundle (JAR + seed catalogs)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp target/*.jar "dist/mise-demo-${VERSION}.jar"
          cp -r demo dist/demo
          echo "MISE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload runnable JAR bundle
        uses: actions/upload-artifact@v7
        with:
          name: mise-demo-${{ env.MISE_VERSION }}-jar
          path: dist/
          if-no-files-found: error

      - name: Set up QEMU (arm64 runtime stage)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: v1.2.3 → 1.2.3, 1.2 and latest (latest=auto on semver tags).
      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
